server {
    listen 80;
    server_name m22.example.com;             # đổi thành domain của nhóm; chưa có domain thì ghi IP hoặc _

    root /opt/m22/web;
    index index.html;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    client_max_body_size 20m;

    # Bước 11: bỏ comment sau khi tạo /etc/nginx/.htpasswd-m22 bằng htpasswd.
    # auth_basic "M22 Dashboard";
    # auth_basic_user_file /etc/nginx/.htpasswd-m22;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;             # lần đầu sinh dữ liệu giả có thể chậm
    }

    # File có hash trong tên do Vite sinh → cache dài hạn
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: mọi đường dẫn của React Router trả về index.html; không cache index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
